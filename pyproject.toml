[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unify-train"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "torchvision>=0.28.0",
    "datasets>=5.0.1",
    "click>=8.0",
]

[project.scripts]
unify-train = "core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]
qlora = [
    "bitsandbytes>=0.43",
]
generation-eval = [
    "sacrebleu>=2.0",
    "rouge-score>=0.1",
]
classification-eval = [
    "scikit-learn>=1.0",
]
all-extras = [
    "bitsandbytes>=0.43",
    "sacrebleu>=2.0",
    "rouge-score>=0.1",
    "scikit-learn>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "adapters*"]
