model:
  name: resnet18
  params:
    num_classes: 10

dataset:
  name: synthetic_image
  params:
    size: 64
    num_classes: 10
    image_size: 64
    channels: 3
    seed: 42

strategy:
  name: supervised
  params:
    lr: 0.01
    momentum: 0.9

evaluator:
  name: accuracy

io_type:
  input: image
  output: category

task: null

train:
  max_epochs: 2
  batch_size: 8
  gradient_accumulation_steps: 1
  log_every_n_steps: 2

output_dir: outputs/vision_supervised_example
