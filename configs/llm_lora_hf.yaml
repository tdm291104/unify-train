model:
  name: hf_causal_lm
  params:
    pretrained: distilgpt2

dataset:
  name: hf_text
  params:
    dataset_name: wikitext
    dataset_config: wikitext-2-raw-v1
    split: train
    text_column: text
    pretrained: distilgpt2
    max_length: 128
    filter_empty: true

strategy:
  name: lora
  params:
    r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    lr: 3e-4
    scheduler: cosine
    t_max: 3

evaluator:
  name: perplexity

io_type:
  input: text
  output: text

task: null

train:
  max_epochs: 3
  batch_size: 8
  gradient_accumulation_steps: 1
  log_every_n_steps: 100

output_dir: outputs/llm_lora_hf
